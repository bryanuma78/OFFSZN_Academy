<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta – OFFSZN Academy</title>
    <link rel="stylesheet" href="/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <script>
        const token = localStorage.getItem('authToken');
        if (!token) {
            //si no hay token, al login
            window.location.replace('/pages/login.html');
        }
    </script>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <a href="/index.html">OFFSZN Academy</a>
        </div>

        <button class="menu-toggle" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>

        <nav>
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/pages/cursos.html">Cursos</a></li>
                <li><a href="/pages/preset.html">Presets</a></li>
                <li><a href="/pages/playlist.html">Playlist</a></li>
                <li><a href="/pages/contacto.html">Contacto</a></li>
                <li><a href="#" id="logout-button" class="btn-logout">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 100px 5%; min-height: 70vh;">
        <h1>Bienvenido</h1>
        <p>Aquí verás tus cursos, presets y contenido exclusivo.</p>
        <p>Esta página está protegida. Solo puedes verla si has iniciado sesión.</p>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>OFFSZN 2025 © – Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="/script/menu.js"></script>
    <script>
        document.getElementById('logout-button').addEventListener('click', (e) => {
            e.preventDefault();
            //borra el token y redirige al inicio
            localStorage.removeItem('authToken');
            alert('¡Has cerrado sesión!');
            window.location.replace('/index.html');
        });
    </script>
</body>

</html>
