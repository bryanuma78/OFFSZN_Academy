<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión – OFFSZN Academy</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet" href="/css/auth.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <a href="/index.html">OFFSZN Academy</a>
        </div>

        <button class="menu-toggle" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>

        <nav>
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/pages/cursos.html">Cursos</a></li>
                <li><a href="/pages/preset.html">Presets</a></li>
                <li><a href="/pages/playlist.html">Playlist</a></li>
                <li><a href="/pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-container">
            <h2>Iniciar Sesión</h2>
            <p>Bienvenido de nuevo. Ingresa a tu cuenta.</p>

            <form id="login-form" class="auth-form">

                <input type="email" id="log-email" name="email" placeholder="Tu correo" required>
                <input type="password" id="log-password" name="password" placeholder="Tu contraseña" required>

                <button type="submit" class="btn">Ingresar</button>

                <div id="form-message" class="form-message" role="alert"></div>

            </form>

            <p class="auth-switch">
                ¿No tienes una cuenta? <a href="/pages/register.html">Regístrate aquí</a>
            </p>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>OFFSZN 2025 © – Todos los derechos reservados.</p>
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="/pages/cursos.html">Cursos</a></li>
                <li><a href="/pages/preset.html">Presets</a></li>
                <li><a href="/pages/playlist.html">Playlist</a></li>
                <li><a href="/pages/contacto.html">Contacto</a></li>
            </ul>
        </div>
    </footer>

    <script src="/script/menu.js"></script>
    <script src="/script/auth.js"></script>
</body>

</html>
